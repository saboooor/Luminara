<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
<title id="title">Protect the whole build</title><desc id="desc">Top-down schematic. Select two opposite corners with a golden shovel, enclosing your home and farm.</desc>
<rect width="800" height="460" rx="20" fill="#211b21"/>
<g font-family="system-ui, sans-serif" fill="#faf4f7" text-anchor="middle">
<text x="400" y="48" font-size="25" font-weight="700">Protect the whole build</text>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity=".08"/></pattern></defs>
<rect x="130" y="85" width="540" height="280" fill="url(#grid)"/>
<rect x="180" y="110" width="440" height="230" rx="4" fill="#a8d5a2" fill-opacity=".10" stroke="#f1c875" stroke-width="3" stroke-dasharray="10 6"/>
<rect x="250" y="165" width="150" height="110" rx="8" fill="#68515d"/><text x="325" y="228" font-size="22">Home</text>
<rect x="445" y="185" width="110" height="90" rx="8" fill="#45664b"/><text x="500" y="236" font-size="22">Farm</text>
<circle cx="180" cy="110" r="16" fill="#f1c875"/><text x="180" y="116" fill="#211b21" font-size="17" font-weight="700">1</text>
<circle cx="620" cy="340" r="16" fill="#f1c875"/><text x="620" y="346" fill="#211b21" font-size="17" font-weight="700">2</text>
<text x="400" y="401" font-size="20">Right-click two opposite corners with a golden shovel.</text>
<text x="400" y="431" font-size="16" fill="#d0bbc7">Top-down schematic · check the outline in game</text>
</g></svg>